<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/sub.css">
    <link rel="stylesheet" href="css/other.css">
    <link rel="icon" href="img/몬스터볼.png">
    <title>OTHER</title>
</head>
<body data-collection="other">

    <header class="site-header">
        <a href="index.html" class="site-logo" aria-label="시시비비">
            <img src="img/logo.svg" alt="시시비비" width="138" height="40">
        </a>
        <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="navPanel" aria-label="메뉴 열기">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-panel" id="navPanel">
            <nav class="gnb">
                <div class="gnb-item">
                    <a href="original.html">캐릭터</a>
                    <div class="gnb-sub">
                        <a href="original.html">ORIGINAL</a>
                        <a href="au.html">AU·TRPG</a>
                    </div>
                </div>
                <a href="universe.html">세계관</a>
                <a href="relationship.html">관계란</a>
                <div class="gnb-item">
                    <a href="archive.html">아카이브</a>
                    <div class="gnb-sub">
                        <a href="archive.html">갤러리</a>
                        <a href="trpg.html">TRPG</a>
                    </div>
                </div>
                <a href="other.html" aria-current="page">기타</a>
            </nav>
            <button type="submit" class="login-btn" id="loginBtn">로그인</button>
        </div>
    </header>

    <main class="page">

        <!--본문 영역-->
        <div class="page-body">
            <section class="etc" id="etc">

                <!--좌측: 메모 · 링크 박스 3개 (내용은 js/other.js에서 연결)-->
                <div class="etc-notes">
                    <img class="etc-dot" src="img/도트.gif" alt="" width="800" height="188">

                    <div class="note" data-note="0">
                        <div class="note-text">
                            <h2 data-field="note0Title" data-placeholder="제목"></h2>
                            <span class="note-body" data-field="note0Body" data-placeholder="메모 또는 링크 설명"></span>
                            <span class="note-link admin-only" data-field="note0Link" data-placeholder="링크 주소 (비워두면 이동 없음)"></span>
                        </div>
                        <a class="note-go" aria-label="이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024" aria-hidden="true">
                                <path d="M0 0h1024v1024H0z" fill="none" />
                                <path fill="#d9e5f7" d="M685.2 104.7a64 64 0 0 1 0 90.5L368.4 512l316.8 316.8a64 64 0 0 1-90.4 90.5l-362.1-362a64 64 0 0 1 0-90.5l362-362.1a64 64 0 0 1 90.5 0" />
                            </svg>
                        </a>
                    </div>

                    <div class="note" data-note="1">
                        <div class="note-text">
                            <h2 data-field="note1Title" data-placeholder="제목"></h2>
                            <span class="note-body" data-field="note1Body" data-placeholder="메모 또는 링크 설명"></span>
                            <span class="note-link admin-only" data-field="note1Link" data-placeholder="링크 주소 (비워두면 이동 없음)"></span>
                        </div>
                        <a class="note-go" aria-label="이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024" aria-hidden="true">
                                <path d="M0 0h1024v1024H0z" fill="none" />
                                <path fill="#d9e5f7" d="M685.2 104.7a64 64 0 0 1 0 90.5L368.4 512l316.8 316.8a64 64 0 0 1-90.4 90.5l-362.1-362a64 64 0 0 1 0-90.5l362-362.1a64 64 0 0 1 90.5 0" />
                            </svg>
                        </a>
                    </div>

                    <div class="note" data-note="2">
                        <div class="note-text">
                            <h2 data-field="note2Title" data-placeholder="제목"></h2>
                            <span class="note-body" data-field="note2Body" data-placeholder="메모 또는 링크 설명"></span>
                            <span class="note-link admin-only" data-field="note2Link" data-placeholder="링크 주소 (비워두면 이동 없음)"></span>
                        </div>
                        <a class="note-go" aria-label="이동">
                            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024" aria-hidden="true">
                                <path d="M0 0h1024v1024H0z" fill="none" />
                                <path fill="#d9e5f7" d="M685.2 104.7a64 64 0 0 1 0 90.5L368.4 512l316.8 316.8a64 64 0 0 1-90.4 90.5l-362.1-362a64 64 0 0 1 0-90.5l362-362.1a64 64 0 0 1 90.5 0" />
                            </svg>
                        </a>
                    </div>
                </div>

                <!--우측: 폴라로이드 2장 (두 번째 카드가 위로 겹침)-->
                <div class="etc-photos">
                    <figure class="polaroid">
                        <div class="img-slot polaroid-img" data-image="photo0">
                            <img alt="">
                            <span class="img-empty">241 × 310</span>
                            <div class="admin-tools"><button type="button" data-action="image">이미지 변경</button></div>
                        </div>
                        <figcaption>
                            <span data-field="photo0Date" data-placeholder="날짜 입력"></span>
                            <h3 data-field="photo0Name" data-placeholder="이름 입력"></h3>
                        </figcaption>
                    </figure>
                    <figure class="polaroid">
                        <div class="img-slot polaroid-img" data-image="photo1">
                            <img alt="">
                            <span class="img-empty">241 × 310</span>
                            <div class="admin-tools"><button type="button" data-action="image">이미지 변경</button></div>
                        </div>
                        <figcaption>
                            <span data-field="photo1Date" data-placeholder="날짜 입력"></span>
                            <h3 data-field="photo1Name" data-placeholder="이름 입력"></h3>
                        </figcaption>
                    </figure>
                </div>

            </section>
        </div>

        <!--뮤직플레이어-->
        <div class="player" id="player">
            <button type="button" class="pl-btn" data-pl="prev" aria-label="이전 곡">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h1.6v10H3zM13 3.2v9.6L5.8 8z"/></svg>
            </button>
            <button type="button" class="pl-btn pl-play" data-pl="toggle" aria-label="재생">
                <svg class="ic-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11L13 8z"/></svg>
                <svg class="ic-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
            </button>
            <button type="button" class="pl-btn" data-pl="next" aria-label="다음 곡">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.4 3H13v10h-1.6zM3 3.2v9.6L10.2 8z"/></svg>
            </button>
            <div class="pl-title"><span id="plTitle">재생할 음악이 없습니다</span></div>
            <div class="pl-progress" id="plProgress"><div class="pl-bar" id="plBar"></div></div>
            <span class="pl-time" id="plTime">0:00</span>
            <div class="pl-vol" id="plVol">
                <button type="button" class="pl-btn" data-pl="volume" aria-label="음소거">
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M1.5 5.75h2.6L7.5 2.8v10.4L4.1 10.25H1.5z"/>
                        <path class="vol-w1" d="M10 5.6a3.4 3.4 0 0 1 0 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path class="vol-w2" d="M12.1 3.5a6.4 6.4 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path class="vol-x" d="M10.5 6l4 4m0-4l-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="pl-vol-pop">
                    <input type="range" id="plVolume" min="0" max="100" step="1" value="70" aria-label="볼륨">
                </div>
            </div>
            <button type="button" class="pl-btn" data-pl="list" aria-label="플레이리스트">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h9V5H2zM2 7.25h9v1.5H2zM2 11h6v1.5H2zM12 9.2V2.5h1.5v1.6h1.5v1.5h-1.5v6.1a1.9 1.9 0 1 1-1.5-1.86z"/></svg>
            </button>

            <div class="pl-panel" id="plPanel" hidden>
                <div class="pl-panel-head">
                    <strong>플레이리스트</strong>
                    <button type="button" class="chip admin-only" id="plUpload">+ 음악 추가</button>
                </div>
                <ol class="pl-list" id="plList"></ol>
            </div>
            <audio id="plAudio" preload="metadata"></audio>
        </div>

    </main>

    <script type="module" src="js/sub.js"></script>
    <script type="module" src="js/other.js"></script>

</body>
</html>
